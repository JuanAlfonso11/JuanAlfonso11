name: Serpiente de contribuciones

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#e10600&color_dots=#ebedf0,#c8c8c8,#9a9a9a,#5c5c5c,#1f1f1f
            dist/snake-dark.svg?color_snake=#e10600&color_dots=#161b22,#2d2d2d,#525252,#8a8a8a,#d4d4d4

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          keep_files: false
